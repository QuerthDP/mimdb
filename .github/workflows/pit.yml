name: PIT Integration Tests

on:
  push:
  pull_request:

jobs:
  pit-test:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: pit/go.sum

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: mimdb:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run PIT tests
      working-directory: pit
      run: |
        go test ./tests -db-run-docker true -v --db-image mimdb:latest --db-port 3000
